name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Least privilege: CI only needs to read the repo.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    strategy:
      fail-fast: false
      matrix:
        # Darwin binaries ship in releases, so macOS must be exercised: it catches
        # path/separator differences in safepath/mirror a Linux-only run would miss.
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          # Single source of truth for the Go version: the module's go directive.
          go-version-file: go.mod
          check-latest: true
      - name: Build
        run: make build
      - name: Verify stamped build provenance
        run: |
          ./atl version > "$RUNNER_TEMP/atl-version.json"
          grep -F "\"commit\": \"$(git rev-parse HEAD)\"" "$RUNNER_TEMP/atl-version.json"
          grep -F '"build_state": "clean"' "$RUNNER_TEMP/atl-version.json"
      - name: Vet
        run: go vet ./...
      # -race needs cgo (ThreadSanitizer is a C runtime); the runners ship a C
      # toolchain and CGO defaults on. -covermode=atomic is mandatory with -race —
      # non-atomic coverage counters would themselves be a data race. -count=1
      # defeats the test cache so a stale pass can't masquerade as green; -timeout
      # dumps goroutine stacks instead of hanging the job on a deadlock.
      # Core-internal coverage attributes calls across product package
      # boundaries without instrumenting the separately gated evaluator.
      - name: Test
        run: |
          core_packages="$(go run ./scripts/list-go-packages --class core)"
          core_cover="$(go run ./scripts/list-go-packages --class core --scope internal --format csv)"
          test -n "$core_packages"
          test -n "$core_cover"
          go test -race -covermode=atomic -coverprofile=cover.out -coverpkg="$core_cover" -count=1 -timeout=10m $core_packages
      - name: Coverage summary
        run: |
          {
            echo "### Core/product coverage — cross-package (${{ matrix.os }})"
            echo '```'
            go tool cover -func=cover.out | tail -1
            echo '```'
            echo "<details><summary>Per-function coverage</summary>"
            echo
            echo '```'
            go tool cover -func=cover.out
            echo '```'
            echo "</details>"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: go.mod tidy check
        run: |
          go mod tidy
          git diff --exit-code go.mod go.sum
      - name: Static CGO-free build
        run: CGO_ENABLED=0 go build ./...
      - name: Windows source cross-compile
        if: matrix.os == 'ubuntu-latest'
        run: make check-windows-compile

  agent-eval:
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
          check-latest: true
      - name: Classify evaluation impact
        id: impact
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "heavy=true" >> "$GITHUB_OUTPUT"
          elif git diff --quiet "$BASE_SHA" "$GITHUB_SHA" -- \
            go.mod go.sum Makefile .github/workflows/ci.yml .github/workflows/release.yml \
            .claude-plugin .mcp.json skills skills-src plugins/atl \
            internal/agenteval internal/capability internal/diagnostic internal/safepath \
            internal/skillmeta internal/testbackend scripts/agent-eval scripts/list-go-packages \
            benchmarks/agent-eval internal/cli/testdata/agent-eval; then
            echo "heavy=false" >> "$GITHUB_OUTPUT"
          else
            echo "heavy=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Product compatibility contract
        if: steps.impact.outputs.heavy != 'true'
        run: make agent-eval-compat
      - name: Complete evaluation contract
        if: steps.impact.outputs.heavy == 'true'
        run: make agent-eval-race

  lint:
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
          check-latest: true
      - name: Maintainer toolchain contract
        run: make check-maintainer-contract
      - name: Core/heavy package boundary
        run: make check-package-boundary
      - name: Generated plugin trees are current
        run: make check-plugins
      - name: Indexed documentation contract
        run: make check-context7-docs
      - name: Onboarding documentation rehearsal
        run: make check-onboarding-docs
      - name: golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          # Pinned (not "latest") so a compromised/yanked upstream release cannot
          # silently enter CI. Must be a v2 build compiled with Go >= 1.26 (the
          # module's go directive); bump deliberately when the toolchain moves.
          version: v2.12.2

  govulncheck:
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
          check-latest: true
      - name: govulncheck
        run: |
          # Pinned (not "@latest") so a yanked/compromised upstream release cannot
          # silently enter CI; bump deliberately.
          go install golang.org/x/vuln/cmd/govulncheck@v1.4.0
          govulncheck ./...

  smoke:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
          check-latest: true
      - name: Build
        run: make build
      - name: Verify merged build provenance
        run: |
          ATL_NO_UPDATE=1 ./atl version > "$RUNNER_TEMP/atl-version.json"
          grep -F "\"commit\": \"$GITHUB_SHA\"" "$RUNNER_TEMP/atl-version.json"
          grep -F '"build_state": "clean"' "$RUNNER_TEMP/atl-version.json"
      - name: CLI startup smoke
        run: ATL_NO_UPDATE=1 ./atl --help > /dev/null
