name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [ready_for_review]

# Least privilege: CI only needs to read the repo.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  binding:
    if: github.event_name == 'pull_request'
    outputs:
      plan: ${{ steps.binding.outputs.plan }}
      product: ${{ steps.binding.outputs.product }}
      evaluator: ${{ steps.binding.outputs.evaluator }}
      platform: ${{ steps.binding.outputs.platform }}
      security: ${{ steps.binding.outputs.security }}
      corpus: ${{ steps.binding.outputs.corpus }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
          check-latest: true
      - name: Bind current pull request revision
        id: binding
        env:
          GH_TOKEN: ${{ github.token }}
        run: env -u GOROOT GOTOOLCHAIN=auto GOWORK=off go run ./scripts/check-premerge bind

  test:
    needs: binding
    if: needs.binding.outputs.product == 'true'
    strategy:
      fail-fast: false
      matrix:
        # Darwin binaries ship in releases, so macOS must be exercised: it catches
        # path/separator differences in safepath/mirror a Linux-only run would miss.
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          # Single source of truth for the Go version: the module's go directive.
          go-version-file: go.mod
          check-latest: true
      - name: Build
        run: make build
      - name: Verify stamped build provenance
        run: |
          ATL_NO_UPDATE=1 ./atl version > "$RUNNER_TEMP/atl-version.json"
          grep -F "\"commit\": \"$(git rev-parse HEAD)\"" "$RUNNER_TEMP/atl-version.json"
          grep -F '"build_state": "clean"' "$RUNNER_TEMP/atl-version.json"
      - name: Vet
        run: make vet
      # -race needs cgo (ThreadSanitizer is a C runtime); the runners ship a C
      # toolchain and CGO defaults on. -covermode=atomic is mandatory with -race —
      # non-atomic coverage counters would themselves be a data race. -count=1
      # defeats the test cache so a stale pass can't masquerade as green; -timeout
      # dumps goroutine stacks instead of hanging the job on a deadlock.
      # Core-internal coverage attributes calls across product package
      # boundaries without instrumenting the separately gated evaluator.
      - name: Core race and coverage gate
        run: make check-core-race-coverage
      - name: Coverage summary
        run: |
          {
            echo "### Core/product coverage — cross-package (${{ matrix.os }})"
            echo '```'
            go tool cover -func=cover.out | tail -1
            echo '```'
            echo "<details><summary>Per-function coverage</summary>"
            echo
            echo '```'
            go tool cover -func=cover.out
            echo '```'
            echo "</details>"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Product go.mod tidy check
        run: |
          env -u GOROOT GOTOOLCHAIN=auto GOWORK=off go mod tidy
          git diff --exit-code go.mod go.sum
      - name: Product static CGO-free build
        run: env -u GOROOT GOTOOLCHAIN=auto GOWORK=off CGO_ENABLED=0 go build ./...
      - name: Windows source cross-compile
        if: matrix.os == 'ubuntu-latest'
        run: make check-windows-compile

  corpus-devcontainer:
    needs: binding
    if: needs.binding.outputs.corpus == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
          check-latest: true
      - name: Private corpus devcontainer contract
        run: make check-corpus-devcontainer
      - name: Build exact runtime smoke binaries
        run: |
          make build
          mkdir -p tmp
          env -u GOROOT GOTOOLCHAIN=auto GOWORK=off CGO_ENABLED=0 \
            go build -trimpath -o tmp/corpus-devcontainer-check ./scripts/check-corpus-devcontainer
      - name: Install locked Dev Containers CLI
        run: |
          install -d "$RUNNER_TEMP/atl-devcontainers-cli"
          cp scripts/check-corpus-devcontainer/package.json \
            scripts/check-corpus-devcontainer/package-lock.json \
            "$RUNNER_TEMP/atl-devcontainers-cli/"
          npm ci --prefix "$RUNNER_TEMP/atl-devcontainers-cli" \
            --ignore-scripts --audit=false --fund=false
      - name: Pinned private corpus runtime
        env:
          ATL_VERSION: v0.7.1
          ATL_ASSET_SHA256: 33d113fc3e8c90f485293b3e0100cfd8877beccf646536692d31c00e5558ab5a
        run: |
          cli="$RUNNER_TEMP/atl-devcontainers-cli/node_modules/.bin/devcontainer"
          "$cli" up \
            --workspace-folder "$GITHUB_WORKSPACE" \
            --config "$GITHUB_WORKSPACE/examples/corpus-devcontainer/.devcontainer/devcontainer.json" \
            --frozen-lockfile
          "$cli" exec --workspace-folder "$GITHUB_WORKSPACE" \
            --config "$GITHUB_WORKSPACE/examples/corpus-devcontainer/.devcontainer/devcontainer.json" \
            scripts/check-corpus-devcontainer/container-smoke.sh

  agent-eval:
    needs: binding
    if: needs.binding.outputs.evaluator == 'compat' || needs.binding.outputs.evaluator == 'full'
    timeout-minutes: 75
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
          check-latest: true
      - name: Product compatibility contract
        if: needs.binding.outputs.evaluator == 'compat'
        run: make agent-eval-compat
      - name: Complete agent-evaluation gate
        if: needs.binding.outputs.evaluator == 'full'
        run: make agent-eval-full

  agent-eval-platform:
    needs: binding
    if: needs.binding.outputs.platform == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
          check-latest: true
      - name: Extension protocol runtime
        run: |
          env -u GOROOT GOTOOLCHAIN=auto GOWORK=off go -C internal/agenteval test ./extension \
            -run '^(TestExtensionManifestV1IsClosed|TestExtensionProtocolV1StateMachineIsClosed)$' -count=1
          env -u GOROOT GOTOOLCHAIN=auto GOWORK=off go -C internal/agenteval test . \
            -run '^(TestExtensionHostAdmissionMaterializesNativeExecutableWithClosedEnvironment|TestExtensionHostAdmissionRejectsUnsafeExecutable|TestExtensionProcessHostBoundsAndCleanup|TestDarwinZombieOnlyProcessGroupSignal|TestVerifyExtensionProtocolReportIsContentMinimized|TestPrivateExtensionRuntimeRootUsesTrustedSystemTemporaryDirectory|TestPrivateExtensionRuntimePathsAreOwnerOnly|TestPrivateExtensionRuntimeRejectsSymlinks|TestExtensionPlatformEnvironmentIsEmptyOnUnix)$' -count=1
      - name: Scheduler runtime
        run: |
          env -u GOROOT GOTOOLCHAIN=auto GOWORK=off go -C internal/agenteval test ./scheduler \
            -run '^(TestSchedulerCodecIsClosedCanonicalBoundedAndContentAddressed|TestSchedulerDispatchIsRoundOrderedBoundedAndCompletionOrderIndependent|TestSchedulerCohortAndResourceLimitsBoundEachBatch|TestSchedulerCostExhaustionStopsBeforeTheNextReservation|TestSchedulerFailFastCancelsTheCurrentBatchAndNeverStartsLaterRounds|TestSchedulerCanceledContextStartsNothing|TestSchedulerResumeCountsTerminalTasksAndDispatchesOnlyPlannedComplement|TestSchedulerPlanRejectsRosterOrderCohortAndResourceDrift)$' -count=1
          env -u GOROOT GOTOOLCHAIN=auto GOWORK=off go -C internal/agenteval test . \
            -run '^(TestScheduledReferenceParallelBlocksMatchTheSequentialOracleExactly|TestScheduledReferenceResumePreservesTerminalAttemptAndRunsOnlyPlannedComplement|TestScheduledReferenceResumeAbsorbsCommittedCrashTailAsUnknownWithoutReplay|TestScheduledReferenceResumeRejectsArtifactsForNeverStartedAttempt|TestScheduledReferenceResumeRejectsStartedAttemptAfterPlannedScheduleMember)$' -count=1

  agent-eval-extension-windows:
    needs: binding
    if: needs.binding.outputs.platform == 'true'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
          check-latest: true
      - name: Extension protocol runtime
        shell: pwsh
        run: |
          Remove-Item Env:GOROOT -ErrorAction SilentlyContinue
          $env:GOTOOLCHAIN = "auto"
          $env:GOWORK = "off"
          go -C internal/agenteval test ./extension `
            -run '^(TestExtensionManifestV1IsClosed|TestExtensionProtocolV1StateMachineIsClosed)$' -count=1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          go -C internal/agenteval test . `
            -run '^(TestAttemptLedgerWindowsFailsClosedBeforeExtensionProcessEntry|TestExtensionHostAdmissionMaterializesNativeExecutableWithClosedEnvironment|TestExtensionHostAdmissionRejectsUnsafeExecutable|TestExtensionProcessHostBoundsAndCleanup|TestVerifyExtensionProtocolReportIsContentMinimized|TestPrivateExtensionWindowsRuntimeACLsAreProtected|TestPrivateExtensionWindowsRootGuardBlocksDeleteUntilClose|TestPrivateExtensionWindowsRuntimeRootAcceptsTrailingBaseSeparator|TestPrivateExtensionWindowsExecutableGuardBlocksReplacementAndLaunchesAdmittedBytes|TestPrivateExtensionWindowsRejectsPermissiveOrInheritedACL|TestPrivateExtensionWindowsRejectsReparseDirectory|TestExtensionPlatformEnvironmentIgnoresAmbientWindowsDirectory)$' -count=1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Scheduler runtime
        shell: pwsh
        run: |
          Remove-Item Env:GOROOT -ErrorAction SilentlyContinue
          $env:GOTOOLCHAIN = "auto"
          $env:GOWORK = "off"
          go -C internal/agenteval test ./scheduler `
            -run '^(TestSchedulerCodecIsClosedCanonicalBoundedAndContentAddressed|TestSchedulerDispatchIsRoundOrderedBoundedAndCompletionOrderIndependent|TestSchedulerCohortAndResourceLimitsBoundEachBatch|TestSchedulerCostExhaustionStopsBeforeTheNextReservation|TestSchedulerFailFastCancelsTheCurrentBatchAndNeverStartsLaterRounds|TestSchedulerCanceledContextStartsNothing|TestSchedulerResumeCountsTerminalTasksAndDispatchesOnlyPlannedComplement|TestSchedulerPlanRejectsRosterOrderCohortAndResourceDrift)$' -count=1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

  contracts:
    needs: binding
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
          check-latest: true
      - name: Maintainer toolchain contract
        run: make check-maintainer-contract
      - name: Agent-eval support policy
        run: make check-agent-eval-support
      - name: Two-module package boundary
        run: make check-package-boundary
      - name: Maintainability ratchets
        run: make check-maintainability
      - name: Generated plugin trees are current
        run: make check-plugins
      - name: Documentation catalog
        run: make check-docs-catalog
      - name: Documentation freshness
        env:
          ATL_DOCS_BASE: ${{ github.event.pull_request.base.sha }}
          ATL_DOCS_HEAD: ${{ github.event.pull_request.head.sha }}
        run: make check-docs-freshness
      - name: Repository maintainer skills
        run: make check-repository-skills
      - name: Reference split compatibility
        run: make check-reference-split
      - name: Indexed documentation contract
        run: make check-context7-docs
      - name: Onboarding documentation rehearsal
        run: make check-onboarding-docs

  lint:
    needs: binding
    if: needs.binding.outputs.product == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
          check-latest: true
      - name: golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          # Pinned (not "latest") so a compromised/yanked upstream release cannot
          # silently enter CI. Must be a v2 build compiled with Go >= 1.26 (the
          # module's go directive); bump deliberately when the toolchain moves.
          version: v2.12.2

  govulncheck:
    needs: binding
    if: needs.binding.outputs.security == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
          check-latest: true
      - name: govulncheck
        run: |
          # Pinned (not "@latest") so a yanked/compromised upstream release cannot
          # silently enter CI; bump deliberately.
          go install golang.org/x/vuln/cmd/govulncheck@v1.4.0
          govulncheck ./...

  codeql:
    needs: binding
    if: needs.binding.outputs.security == 'true'
    permissions:
      contents: read
      security-events: write
    uses: ./.github/workflows/codeql.yml
    with:
      analysis_category: ci-ready

  ci-ready:
    if: always() && github.event_name == 'pull_request'
    needs: [binding, contracts, test, corpus-devcontainer, agent-eval, agent-eval-platform, agent-eval-extension-windows, lint, govulncheck, codeql]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
          check-latest: true
      - name: Require complete checks and current pull request revision
        env:
          GH_TOKEN: ${{ github.token }}
          ATL_PREMERGE_NEEDS: ${{ toJSON(needs) }}
        run: env -u GOROOT GOTOOLCHAIN=auto GOWORK=off go run ./scripts/check-premerge ready

  smoke:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
          check-latest: true
      - name: Build
        run: make build
      - name: Verify merged build provenance
        run: |
          ATL_NO_UPDATE=1 ./atl version > "$RUNNER_TEMP/atl-version.json"
          grep -F "\"commit\": \"$GITHUB_SHA\"" "$RUNNER_TEMP/atl-version.json"
          grep -F '"build_state": "clean"' "$RUNNER_TEMP/atl-version.json"
      - name: CLI startup smoke
        run: ATL_NO_UPDATE=1 ./atl --help > /dev/null
